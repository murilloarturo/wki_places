name: PlacesLauncher
options:
  bundleIdPrefix: com.murilloarturo
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  Factory:
    url: https://github.com/hmlongco/Factory.git
    exactVersion: 3.3.2
targets:
  PlacesLauncher:
    type: application
    platform: iOS
    dependencies:
      - package: Factory
        product: FactoryKit
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Generated
      - path: Resources
    preBuildScripts:
      - name: Generate Localized Strings
        script: "$SRCROOT/scripts/generate-localizations.sh"
        inputFiles:
          - "$SRCROOT/scripts/generate-localizations.sh"
          - "$SRCROOT/swiftgen.yml"
          - "$SRCROOT/Resources/en.lproj/Localizable.strings"
        outputFiles:
          - "$SRCROOT/Generated/Strings+Generated.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murilloarturo.PlacesLauncher
        PRODUCT_NAME: Places
        PRODUCT_MODULE_NAME: PlacesLauncher
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Places
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - PlacesLauncherTests
        - PlacesLauncherUITests
  PlacesLauncherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PlacesLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murilloarturo.PlacesLauncherTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Places.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Places"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PlacesLauncherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PlacesLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murilloarturo.PlacesLauncherUITests
        GENERATE_INFOPLIST_FILE: true
